        marker-end: url(#purple-arrow);
      }
      .memory-access {
        fill: none; stroke: #8063AB; stroke-width: 2.4;
        marker-start: url(#purple-arrow);
        marker-end: url(#purple-arrow);
      }
      .abox-flow {
        fill: none; stroke: #7C8DA0; stroke-width: 2.2;
        stroke-dasharray: 7 5;
        marker-end: url(#gray-arrow-sm);
      }
    </style>
