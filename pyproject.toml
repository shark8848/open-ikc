[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ikc-api"
version = "1.0.0"
description = "FastAPI scaffold for the four public knowledge capabilities"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "PyJWT[crypto]>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "markdown-it-py>=3.0,<5.0",
  "python-multipart>=0.0.9,<1.0",
  # 日志中心 SDK（ikc-log-center），本地 wheel 安装，勿改为源码目录引用：
  #   pip install /home/ikc-log-center/dist/ikc_log_center-1.4.9-py3-none-any.whl
  "ikc-log-center==1.4.9",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
