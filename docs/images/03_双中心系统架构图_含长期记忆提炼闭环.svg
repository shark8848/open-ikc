<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1920" height="1060" viewBox="0 140 1920 1060"
     role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">双中心系统架构：知识、长期记忆与本体决策协同</title>
  <desc id="diagram-desc">
    双中心为智能知识中心与本体决策中心。
    智能知识中心包含知识治理、检索、证据服务与独立的长期记忆区。
    会话、坐席修正、用户反馈和办理结果经授权筛选后写入长期记忆。
    长期记忆按用户、客户或任务范围隔离，可向智能体提供权限范围内的个性化上下文。
    可复用经验经过脱敏、抽取、验证、去重、冲突检查与评审后发布为知识。
    知识中的概念、规则与流程候选经业务评审后进入本体决策中心。
    本体反向支撑记忆提炼与知识治理中的术语统一、实体标注和质量校验。
    业务主数据以源系统为准，长期记忆不能替代实时业务事实。
    业务执行经用户确认和授权后由权威业务系统最终校验并执行。
  </desc>

  <defs>
    <linearGradient id="title-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9201A"/>
      <stop offset="1" stop-color="#E98A42"/>
    </linearGradient>

    <marker id="blue-arrow" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#32649C"/>
    </marker>
    <marker id="amber-arrow" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#B78130"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#27816D"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8063AB"/>
    </marker>
    <marker id="gray-arrow" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7C8DA0"/>
    </marker>
    <marker id="gray-arrow-sm" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7C8DA0"/>
    </marker>

    <style>
