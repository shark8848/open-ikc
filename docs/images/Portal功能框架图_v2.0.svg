<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 630" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1680" height="630" fill="#f8fafc"/>

  <!-- ========== 标题 ========== -->
  <text x="680" y="36" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">ikc-open-platform Portal · 商用功能框架</text>

  <!-- ========== 统一工作台（顶部横带） ========== -->
  <rect x="60" y="64" width="1240" height="86" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-opacity=".55"/>
  <rect x="72" y="80" width="136" height="54" rx="8" fill="url(#gBlue)"/>
  <text x="140" y="103" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">统一工作台</text>
  <text x="140" y="121" text-anchor="middle" font-size="10.5" fill="#dbeafe">入口与访问控制</text>
  <g text-anchor="middle">
    <rect x="228" y="80" width="259" height="54" rx="8" fill="url(#gBlue)"/>
    <text x="357.5" y="103" font-size="13" font-weight="bold" fill="#ffffff">管理认证与 SSO</text>
    <text x="357.5" y="122" font-size="9.5" fill="#ffffff" opacity=".85">admin token · OAuth2 / OIDC / 网关头</text>
    <rect x="495" y="80" width="259" height="54" rx="8" fill="url(#gBlue)"/>
    <text x="624.5" y="103" font-size="13" font-weight="bold" fill="#ffffff">角色与权限菜单</text>
    <text x="624.5" y="122" font-size="9.5" fill="#ffffff" opacity=".85">RBAC · 功能域可见性控制</text>
    <rect x="762" y="80" width="259" height="54" rx="8" fill="url(#gBlue)"/>
    <text x="891.5" y="103" font-size="13" font-weight="bold" fill="#ffffff">实例与环境切换</text>
    <text x="891.5" y="122" font-size="9.5" fill="#ffffff" opacity=".85">多平台实例注册 · 环境一键切换</text>
    <rect x="1029" y="80" width="259" height="54" rx="8" fill="url(#gBlue)"/>
    <text x="1158.5" y="103" font-size="13" font-weight="bold" fill="#ffffff">统一响应协议</text>
    <text x="1158.5" y="122" font-size="9.5" fill="#ffffff" opacity=".85">errCode · errMsg · data · traceId</text>
  </g>
  <line x1="680" y1="152" x2="680" y2="163" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ========== 功能域网格 · 第一行 ========== -->
  <!-- 租户接入与凭证 -->
  <rect x="60" y="166" width="402" height="146" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <rect x="60" y="166" width="402" height="26" rx="8" fill="url(#gTeal)"/>
  <text x="74" y="184" font-size="12.5" font-weight="bold" fill="#ffffff">租户接入与凭证</text>
  <g font-size="10.5" fill="#134e4a">
    <text x="74" y="212">· 租户注册与多级隔离（tenant / org / team）</text>
    <text x="74" y="234">· 调用方接入与访问申请登记</text>
    <text x="74" y="256">· API token 生命周期（创建 / 有效期 / 撤销）</text>
    <text x="74" y="278">· 作用域授权（库 · 文档 · 解析 · 检索）</text>
    <text x="74" y="300">· OAuth2 客户端与 OIDC / SSO 凭证配置</text>
  </g>
  <!-- 实例创建与配置 -->
  <rect x="478" y="166" width="402" height="146" rx="8" fill="#ffffff" stroke="#4338ca" stroke-width="1.4"/>
  <rect x="478" y="166" width="402" height="26" rx="8" fill="url(#gIndigo)"/>
  <text x="492" y="184" font-size="12.5" font-weight="bold" fill="#ffffff">实例创建与配置</text>
  <g font-size="10.5" fill="#312e81">
    <text x="492" y="212">· 平台实例创建与环境接入</text>
    <text x="492" y="234">· 实例注册信息与运行状态巡检</text>
    <text x="492" y="256">· 引擎端点配置（LLM Gateway · 检索 · 解析）</text>
    <text x="492" y="278">· 配额、限流与功能开关参数</text>
    <text x="492" y="300">· 多实例注册与运行环境切换</text>
  </g>
  <!-- 应用配置与授权 -->
  <rect x="896" y="166" width="402" height="146" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
  <rect x="896" y="166" width="402" height="26" rx="8" fill="url(#gViolet)"/>
  <text x="910" y="184" font-size="12.5" font-weight="bold" fill="#ffffff">应用配置与授权</text>
  <g font-size="10.5" fill="#4c1d95">
    <text x="910" y="212">· 应用与接口权限映射（四类业务能力）</text>
    <text x="910" y="234">· 认证模式（static / gateway_header / oidc_jwt）</text>
    <text x="910" y="256">· 鉴权体系与适配器（authz 开关 · X-Auth-System）</text>
    <text x="910" y="278">· 数据权限（owner / org 路径 / 租户 · deny-overrides）</text>
    <text x="910" y="300">· 凭证轮换与撤销即时生效</text>
  </g>

  <!-- ========== 功能域网格 · 第二行 ========== -->
  <!-- 测试与集成支持 -->
  <rect x="60" y="328" width="612" height="146" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.4"/>
  <rect x="60" y="328" width="612" height="26" rx="8" fill="url(#gCyan)"/>
  <text x="74" y="346" font-size="12.5" font-weight="bold" fill="#ffffff">测试与集成支持</text>
  <g font-size="10.5" fill="#164e63">
    <text x="74" y="374">· MCP 工具在线测试（白名单执行 · 参数 JSON）</text>
    <text x="74" y="396">· CLI 命令在线执行 · 参数级白名单 · 超时控制</text>
    <text x="74" y="418">· API Browser 与开发手册在线浏览</text>
    <text x="74" y="440">· 错误码目录与接口 catalog 查询</text>
    <text x="74" y="462">· Python / Java SDK 集成指引</text>
  </g>
  <!-- 平台运营分析与治理 -->
  <rect x="688" y="328" width="612" height="146" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <rect x="688" y="328" width="612" height="26" rx="8" fill="url(#gEmerald)"/>
  <text x="702" y="346" font-size="12.5" font-weight="bold" fill="#ffffff">平台运营分析与治理</text>
  <g font-size="10.5" fill="#065f46">
    <text x="702" y="374">· 实时总览（并发 / 请求量 / 错误率）· 端点与 token 聚合</text>
    <text x="702" y="396">· 请求明细 · traceId 全链路追踪 · 日志与告警</text>
    <text x="702" y="418">· 调用用量与成本分析 · 活跃 / 闲置凭证治理</text>
    <text x="702" y="440">· 容量与性能趋势 · SLA 与健康度报告</text>
    <text x="702" y="462">· 运营审计与合规报表</text>
  </g>
  <line x1="680" y1="476" x2="680" y2="487" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ========== 管理面底座（底部横带） ========== -->
  <rect x="60" y="490" width="1240" height="86" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-opacity=".55"/>
  <rect x="72" y="506" width="136" height="54" rx="8" fill="url(#gSlate)"/>
  <text x="140" y="529" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">管理面底座</text>
  <text x="140" y="547" text-anchor="middle" font-size="10.5" fill="#e2e8f0">接口与数据设施</text>
  <g text-anchor="middle">
    <rect x="228" y="506" width="259" height="54" rx="8" fill="url(#gSlate)"/>
    <text x="357.5" y="529" font-size="13" font-weight="bold" fill="#ffffff">管理面 API</text>
    <text x="357.5" y="548" font-size="9.5" fill="#ffffff" opacity=".85">/admin/* · 独立鉴权 · 统一响应壳</text>
    <rect x="495" y="506" width="259" height="54" rx="8" fill="url(#gSlate)"/>
    <text x="624.5" y="529" font-size="13" font-weight="bold" fill="#ffffff">SQLite 管理面库</text>
    <text x="624.5" y="548" font-size="9.5" fill="#ffffff" opacity=".85">token sha256 · 统计聚合 · 请求明细</text>
    <rect x="762" y="506" width="259" height="54" rx="8" fill="url(#gSlate)"/>
    <text x="891.5" y="529" font-size="13" font-weight="bold" fill="#ffffff">统计采集中间件</text>
    <text x="891.5" y="548" font-size="9.5" fill="#ffffff" opacity=".85">并发计数 · 60s 窗口聚合 · 身份维度</text>
    <rect x="1029" y="506" width="259" height="54" rx="8" fill="url(#gSlate)"/>
    <text x="1158.5" y="529" font-size="13" font-weight="bold" fill="#ffffff">审计与脱敏</text>
    <text x="1158.5" y="548" font-size="9.5" fill="#ffffff" opacity=".85">操作审计 · Authorization 不落库</text>
  </g>

  <!-- ========== 右侧：安全与合规边界竖条 ========== -->
  <rect x="1320" y="64" width="320" height="512" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="1480" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">安全与合规边界</text>
  <text x="1480" y="105" text-anchor="middle" font-size="9.5" fill="#065f46">贯穿全部功能域与底座</text>
  <g text-anchor="middle">
    <rect x="1336" y="118" width="288" height="84" rx="8" fill="url(#gEmerald)"/>
    <text x="1480" y="141" font-size="12.5" font-weight="bold" fill="#ffffff">独立鉴权域</text>
    <text x="1480" y="161" font-size="9.5" fill="#ffffff" opacity=".88">管理面与业务 AUTHN / AUTHZ 完全隔离</text>
    <text x="1480" y="179" font-size="9.5" fill="#ffffff" opacity=".88">豁免业务鉴权但自行强制校验</text>
    <rect x="1336" y="210" width="288" height="84" rx="8" fill="url(#gEmerald)"/>
    <text x="1480" y="233" font-size="12.5" font-weight="bold" fill="#ffffff">凭证安全</text>
    <text x="1480" y="253" font-size="9.5" fill="#ffffff" opacity=".88">明文仅创建时返回一次 · 库中存 sha256</text>
    <text x="1480" y="271" font-size="9.5" fill="#ffffff" opacity=".88">撤销即时生效（业务请求 100401）</text>
    <rect x="1336" y="302" width="288" height="84" rx="8" fill="url(#gEmerald)"/>
    <text x="1480" y="325" font-size="12.5" font-weight="bold" fill="#ffffff">最小权限</text>
    <text x="1480" y="345" font-size="9.5" fill="#ffffff" opacity=".88">token 作用域按业务域收敛</text>
    <text x="1480" y="363" font-size="9.5" fill="#ffffff" opacity=".88">命令 / 工具白名单 · 参数级校验</text>
    <rect x="1336" y="394" width="288" height="84" rx="8" fill="url(#gEmerald)"/>
    <text x="1480" y="417" font-size="12.5" font-weight="bold" fill="#ffffff">默认关闭与能力边界</text>
    <text x="1480" y="437" font-size="9.5" fill="#ffffff" opacity=".88">未配置 admin token 时 503001 关闭</text>
    <text x="1480" y="455" font-size="9.5" fill="#ffffff" opacity=".88">不进业务 catalog · 不暴露内部流水线</text>
    <rect x="1336" y="486" width="288" height="84" rx="8" fill="url(#gEmerald)"/>
    <text x="1480" y="509" font-size="12.5" font-weight="bold" fill="#ffffff">审计与合规</text>
    <text x="1480" y="529" font-size="9.5" fill="#ffffff" opacity=".88">操作审计 · client_ip 脱敏 · 日志不落密钥</text>
    <text x="1480" y="547" font-size="9.5" fill="#ffffff" opacity=".88">生产建议 HTTPS + 网关保护</text>
  </g>

  <!-- ========== 图例 ========== -->
  <g font-size="11.5">
    <rect x="60" y="592" width="16" height="14" rx="3" fill="url(#gTeal)"/>
    <text x="82" y="604" fill="#475569">渐变色条 = 功能域标题</text>
    <rect x="230" y="592" width="16" height="14" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="252" y="604" fill="#475569">白底列表 = 子功能项</text>
    <rect x="400" y="592" width="16" height="14" rx="3" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="422" y="604" fill="#475569">绿虚线条 = 安全与合规边界</text>
    <line x1="600" y1="599" x2="634" y2="599" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="642" y="604" fill="#475569">工作台 → 功能域 → 管理面底座调用方向</text>
  </g>
</svg>
