<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 720" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#be185d"/>
    </marker>
  </defs>

  <rect width="1380" height="720" fill="#ffffff"/>

  <!-- ========== 标题 ========== -->
  <text x="690" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">知识摄入典型流程 · Pipeline 图</text>
  <text x="690" y="72" text-anchor="middle" font-size="14" fill="#64748b">登记 → 密级确认 → 同步 → 解析 → 元数据 → 质检 → 语义映射 → 索引 → 发布｜质检不通过设返工环路</text>

  <!-- ========== 相位分组底衬 ========== -->
  <rect x="42" y="86" width="720" height="88" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1" stroke-opacity=".4"/>
  <text x="44" y="80" font-size="12.5" fill="#0f766e">接入相位（登记 · 确认 · 同步）</text>
  <rect x="792" y="86" width="480" height="88" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1" stroke-opacity=".4"/>
  <text x="1266" y="80" text-anchor="end" font-size="12.5" fill="#4338ca">加工相位（解析 · 元数据）</text>
  <rect x="792" y="402" width="480" height="88" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" stroke-opacity=".4"/>
  <text x="794" y="396" font-size="12.5" fill="#7e22ce">治理相位（质量 · 语义映射）</text>
  <rect x="42" y="402" width="720" height="88" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" stroke-opacity=".4"/>
  <text x="44" y="396" font-size="12.5" fill="#1d4ed8">发布相位（索引 · 发布 · 上线）</text>

  <!-- ========== 步骤节点：第一行（左→右） ========== -->
  <g>
    <rect x="60" y="98" width="190" height="64" rx="12" fill="url(#gTeal)"/>
    <text x="155" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">① 知识源登记</text>
    <text x="155" y="148" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity=".85">Registry · 范围与责任人</text>

    <rect x="310" y="98" width="190" height="64" rx="12" fill="url(#gTeal)"/>
    <text x="405" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">② 权限密级确认</text>
    <text x="405" y="148" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity=".85">ACL · 权限继承与密级</text>

    <rect x="560" y="98" width="190" height="64" rx="12" fill="url(#gTeal)"/>
    <text x="655" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">③ 内容同步</text>
    <text x="655" y="148" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity=".85">Sync · 全量与增量落盘</text>

    <rect x="810" y="98" width="190" height="64" rx="12" fill="url(#gIndigo)"/>
    <text x="905" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">④ 文件及数据解析</text>
    <text x="905" y="148" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity=".85">Parsing · 文档 / 表格 / 音视频</text>

    <rect x="1060" y="98" width="190" height="64" rx="12" fill="url(#gIndigo)"/>
    <text x="1155" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">⑤ 元数据提取</text>
    <text x="1155" y="148" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity=".85">Metadata · 主题时间与摘要</text>
  </g>

  <!-- ========== 步骤节点：第二行（右→左） ========== -->
  <g>
    <rect x="1060" y="413" width="190" height="64" rx="12" fill="url(#gViolet)"/>
    <text x="1155" y="443" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">⑥ 内容质量检查</text>
    <text x="1155" y="463" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity=".85">Quality Gate · 重复矛盾与合规</text>

    <rect x="810" y="413" width="190" height="64" rx="12" fill="url(#gViolet)"/>
    <text x="905" y="443" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">⑦ 本体术语映射</text>
    <text x="905" y="463" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity=".85">Ontology · 概念对齐术语归一</text>

    <rect x="560" y="413" width="190" height="64" rx="12" fill="url(#gBlue)"/>
    <text x="655" y="443" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">⑧ 索引构建</text>
    <text x="655" y="463" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity=".85">Indexing · 全文 / 向量 / 图谱</text>

    <rect x="310" y="413" width="190" height="64" rx="12" fill="url(#gBlue)"/>
    <text x="405" y="443" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">⑨ 发布知识服务</text>
    <text x="405" y="463" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity=".85">Publishing · 知识库上线对外</text>
  </g>

  <!-- ========== 终点：知识资产在线（双框） ========== -->
  <rect x="60" y="413" width="190" height="64" rx="12" fill="url(#gEmerald)"/>
  <rect x="67" y="420" width="176" height="50" rx="9" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity=".7"/>
  <text x="155" y="443" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">知识资产在线</text>
  <text x="155" y="463" text-anchor="middle" font-size="11.5" fill="#ffffff" opacity=".85">Online · 可检索可问答可引用</text>

  <!-- ========== 转移边：第一行 ========== -->
  <line x1="250" y1="130" x2="303" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="277" y="120" text-anchor="middle" font-size="12" fill="#64748b">登记完成</text>
  <line x1="500" y1="130" x2="553" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="527" y="120" text-anchor="middle" font-size="12" fill="#64748b">授权确认</text>
  <line x1="750" y1="130" x2="803" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="777" y="120" text-anchor="middle" font-size="12" fill="#64748b">同步入队</text>
  <line x1="1000" y1="130" x2="1053" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1027" y="120" text-anchor="middle" font-size="12" fill="#64748b">解析完成</text>

  <!-- ⑤ → ⑥ 跨行连接 -->
  <line x1="1155" y1="162" x2="1155" y2="407" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1167" y="250" font-size="12" fill="#64748b">进入治理</text>

  <!-- ========== 转移边：第二行（右→左） ========== -->
  <line x1="1055" y1="445" x2="1008" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1030" y="494" text-anchor="middle" font-size="12" fill="#64748b">质检通过</text>
  <line x1="805" y1="445" x2="758" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="780" y="494" text-anchor="middle" font-size="12" fill="#64748b">语义对齐</text>
  <line x1="555" y1="445" x2="508" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="530" y="494" text-anchor="middle" font-size="12" fill="#64748b">索引就绪</text>
  <line x1="305" y1="445" x2="258" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="280" y="494" text-anchor="middle" font-size="12" fill="#64748b">发布成功</text>

  <!-- ⑥ 质检不通过 → ③ 返工环路（虚线） -->
  <polyline points="1105,413 1105,290 655,290 655,166" fill="none" stroke="#be185d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRose)"/>
  <text x="880" y="282" text-anchor="middle" font-size="12.5" fill="#be185d">质量不达标 · 返工重新同步 / 人工修正</text>

  <!-- ========== 图例与脚注 ========== -->
  <g font-size="12.5">
    <line x1="60" y1="684" x2="100" y2="684" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="108" y="688" fill="#475569">主流转</text>
    <line x1="180" y1="684" x2="220" y2="684" stroke="#be185d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRose)"/>
    <text x="228" y="688" fill="#475569">质量返工环路</text>
    <text x="340" y="688" fill="#475569">▣ 双框 = 在线终点　①–⑨ = 流程步骤序</text>
  </g>
  <text x="1340" y="688" text-anchor="end" font-size="12" fill="#94a3b8">注：权限与密级决定发布后可见范围；各环节失败可原地重试；质检不通过退回内容同步重新处理</text>
</svg>
