<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1240" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#3730a3"/></linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#475569"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <marker id="mFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
    <marker id="mCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
  </defs>
  <rect x="0" y="0" width="1760" height="1240" fill="#f8fafc"/>
  <text x="880" y="46" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">IKC 安全中心 · 信任与鉴权原理流程</text>
  <text x="40" y="118" text-anchor="start" font-size="14" font-weight="bold" fill="#0e7490">安全中心（信任根 · 不在调用链上）</text>
  <rect x="40" y="140" width="390" height="66" rx="12" fill="url(#gCyan)"/>
  <text x="235" y="167" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">内部 CA · Ed25519 信任根</text>
  <text x="235" y="189" text-anchor="middle" font-size="11" fill="#ffffff">签工作负载证书 · SAN=spiffe://ikc/服务</text>
  <rect x="40" y="286" width="390" height="82" rx="12" fill="url(#gBlue)"/>
  <text x="235" y="321" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">控制面 :18200（mTLS）</text>
  <text x="235" y="343" text-anchor="middle" font-size="11" fill="#ffffff">签发 · 逐跳交换 · 吊销 · 自省 · 策略</text>
  <rect x="40" y="404" width="390" height="66" rx="12" fill="url(#gSky)"/>
  <text x="235" y="431" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">数据面 :18201（只读免鉴权）</text>
  <text x="235" y="453" text-anchor="middle" font-size="11" fill="#ffffff">/jwks.json 公钥 · 各服务缓存 ≤300s</text>
  <rect x="40" y="626" width="390" height="66" rx="12" fill="url(#gIndigo)"/>
  <text x="235" y="653" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">服务级授权矩阵</text>
  <text x="235" y="675" text-anchor="middle" font-size="11" fill="#ffffff">policy/service-policy.json · 缺省拒绝</text>
  <rect x="540" y="140" width="440" height="66" rx="12" fill="url(#gCyan)"/>
  <text x="760" y="167" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">① 边界入口铸造</text>
  <text x="760" y="189" text-anchor="middle" font-size="11" fill="#ffffff">网关/平台 mayMintSubject · sub=用户 · scope=链预算上限</text>
  <rect x="540" y="286" width="440" height="82" rx="12" fill="url(#gBlue)"/>
  <text x="760" y="321" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">② 逐跳交换（收窄）</text>
  <text x="760" y="343" text-anchor="middle" font-size="11" fill="#ffffff">凭父票换 aud=下一跳 · scope↓ · 资源绑定 · 受众收窄</text>
  <rect x="540" y="404" width="440" height="66" rx="12" fill="url(#gTeal)"/>
  <text x="760" y="431" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">③ 携带票据 mTLS 直连目标服务</text>
  <text x="760" y="453" text-anchor="middle" font-size="11" fill="#ffffff">中心不代理 / 不转发 / 不在调用链上</text>
  <polygon points="760.0,494 935.0,560 760.0,626 585.0,560" fill="url(#gSky)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="760.0" y="556" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">④ 本地验签通过？</text>
  <text x="760.0" y="576" text-anchor="middle" font-size="10.5" fill="#ffffff">签名·时效·受众=我·scope词表·资源绑定</text>
  <polygon points="760.0,646 935.0,712 760.0,778 585.0,712" fill="url(#gIndigo)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="760.0" y="708" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">⑤ 矩阵 canCall 允许？</text>
  <text x="760.0" y="728" text-anchor="middle" font-size="10.5" fill="#ffffff">服务级授权矩阵 · 缺省拒绝</text>
  <polygon points="760.0,798 925.0,858 760.0,918 595.0,858" fill="url(#gViolet)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="760.0" y="863" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">⑥ 高危（写面/一次性）？</text>
  <rect x="540" y="944" width="440" height="66" rx="12" fill="url(#gViolet)"/>
  <text x="760" y="971" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">⑦ 执行本地业务 → 再换下一跳（收窄）</text>
  <text x="760" y="993" text-anchor="middle" font-size="11" fill="#ffffff">逐跳递减 · 委托链 ikc.delegationChain 追加</text>
  <rect x="560" y="1064" width="400" height="62" rx="12" fill="url(#gSlate)"/>
  <text x="760" y="1089" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">审计台账 audit.jsonl</text>
  <text x="760" y="1111" text-anchor="middle" font-size="11" fill="#ffffff">append-only · 签发/交换/拒绝对/吊销 · 只记 jti</text>
  <rect x="1050" y="528" width="350" height="62" rx="12" fill="url(#gRose)"/>
  <text x="1225" y="553" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">拒绝 100401 未认证</text>
  <text x="1225" y="575" text-anchor="middle" font-size="11" fill="#ffffff">signature / exp / audience / scope 不符</text>
  <rect x="1050" y="680" width="350" height="62" rx="12" fill="url(#gRose)"/>
  <text x="1225" y="705" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">拒绝 100403 policy_denied</text>
  <text x="1225" y="727" text-anchor="middle" font-size="11" fill="#ffffff">矩阵外调用关系 · 未登记工作负载</text>
  <rect x="1050" y="826" width="350" height="66" rx="12" fill="url(#gSlate)"/>
  <text x="1225" y="853" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">自省 /v1/token/introspect</text>
  <text x="1225" y="875" text-anchor="middle" font-size="11" fill="#ffffff">判 jti_revoked / jti_replayed · 唯一有吊销保护</text>
  <line x1="760.0" y1="206" x2="760.0" y2="286" stroke="#64748b" stroke-width="2" marker-end="url(#mFlow)"/>
  <line x1="760.0" y1="368" x2="760.0" y2="404" stroke="#64748b" stroke-width="2" marker-end="url(#mFlow)"/>
  <line x1="760.0" y1="470" x2="760.0" y2="494" stroke="#64748b" stroke-width="2" marker-end="url(#mFlow)"/>
  <line x1="760.0" y1="626" x2="760.0" y2="646" stroke="#059669" stroke-width="2" marker-end="url(#mGreen)"/>
  <text x="774.0" y="640" text-anchor="start" font-size="11" font-weight="bold" fill="#059669">是</text>
  <line x1="760.0" y1="778" x2="760.0" y2="798" stroke="#059669" stroke-width="2" marker-end="url(#mGreen)"/>
  <text x="774.0" y="792" text-anchor="start" font-size="11" font-weight="bold" fill="#059669">是</text>
  <line x1="760.0" y1="918" x2="760.0" y2="944" stroke="#059669" stroke-width="2" marker-end="url(#mGreen)"/>
  <text x="774.0" y="936" text-anchor="start" font-size="11" font-weight="bold" fill="#059669">否·放行</text>
  <line x1="980" y1="560" x2="1050" y2="559" stroke="#e11d48" stroke-width="2" marker-end="url(#mRed)"/>
  <text x="1015.0" y="552" text-anchor="middle" font-size="11" font-weight="bold" fill="#e11d48">否</text>
  <line x1="980" y1="712" x2="1050" y2="711" stroke="#e11d48" stroke-width="2" marker-end="url(#mRed)"/>
  <text x="1015.0" y="704" text-anchor="middle" font-size="11" font-weight="bold" fill="#e11d48">否</text>
  <line x1="980" y1="858" x2="1050" y2="859" stroke="#64748b" stroke-width="2" marker-end="url(#mFlow)"/>
  <text x="1015.0" y="850" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">是</text>
  <path d="M1225.0,892 L1225.0,977 L980,977" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mGreen)"/>
  <text x="1233.0" y="970" text-anchor="start" font-size="10.5" font-weight="normal" fill="#059669">active→放行</text>
  <path d="M540,977 C 470,977 470,327 540,327" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mCyan)"/>
  <line x1="430" y1="173" x2="540" y2="173" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mCyan)"/>
  <text x="485.0" y="166" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#0891b2">工作负载证书</text>
  <line x1="430" y1="320" x2="540" y2="320" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mGreen)"/>
  <text x="485.0" y="313" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#059669">exchange 换票</text>
  <line x1="430" y1="437" x2="540" y2="437" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mGreen)"/>
  <text x="485.0" y="430" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#059669">公钥</text>
  <line x1="430" y1="659" x2="540" y2="700" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mGreen)"/>
  <text x="491.0" y="648" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#059669">canCall</text>
  <line x1="660" y1="1010" x2="660" y2="1064" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#mFlow)"/>
  <path d="M1050,559 L1010,559 L1010,1095 L940,1095" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#mFlow)"/>
  <path d="M1050,711 L1026,711 L1026,1095" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#mFlow)"/>
  <line x1="1050" y1="859" x2="960" y2="1095" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#mFlow)"/>
  <text x="1000" y="1090" text-anchor="start" font-size="10.5" font-weight="normal" fill="#64748b">拒绝对/自省/签发 → 落审计</text>
  <rect x="1440" y="140" width="280" height="906" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1580.0" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">原理纪律</text>
  <rect x="1454" y="196" width="252" height="108" rx="12" fill="url(#gGreen)"/>
  <text x="1580" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">中心不在调用链</text>
  <text x="1580" y="266" text-anchor="middle" font-size="11" fill="#ffffff">不代理 · 不转发 · 不主动连接</text>
  <rect x="1454" y="318" width="252" height="108" rx="12" fill="url(#gGreen)"/>
  <text x="1580" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">三要素乘积</text>
  <text x="1580" y="388" text-anchor="middle" font-size="11" fill="#ffffff">通道(mTLS)×身份(SAN)×授权(票据)</text>
  <rect x="1454" y="440" width="252" height="108" rx="12" fill="url(#gGreen)"/>
  <text x="1580" y="488" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">非升级不变量</text>
  <text x="1580" y="510" text-anchor="middle" font-size="11" fill="#ffffff">scope⊆父 · 资源不放大 · sub不变</text>
  <rect x="1454" y="562" width="252" height="108" rx="12" fill="url(#gGreen)"/>
  <text x="1580" y="610" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">受众逐跳收窄</text>
  <text x="1580" y="632" text-anchor="middle" font-size="11" fill="#ffffff">aud 只能=下一跳 · 不跨服务复用</text>
  <rect x="1454" y="684" width="252" height="108" rx="12" fill="url(#gGreen)"/>
  <text x="1580" y="732" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">缺省拒绝</text>
  <text x="1580" y="754" text-anchor="middle" font-size="11" fill="#ffffff">未登记关系 / 词表外 scope 一律拒</text>
  <rect x="1454" y="806" width="252" height="108" rx="12" fill="url(#gGreen)"/>
  <text x="1580" y="854" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">fail-closed</text>
  <text x="1580" y="876" text-anchor="middle" font-size="11" fill="#ffffff">任一不确定即拒 · 不放行大概率</text>
  <rect x="1454" y="928" width="252" height="108" rx="12" fill="url(#gGreen)"/>
  <text x="1580" y="976" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">短 TTL 补偿</text>
  <text x="1580" y="998" text-anchor="middle" font-size="11" fill="#ffffff">本地验签无吊销保护 → 300s 压窗</text>
</svg>
