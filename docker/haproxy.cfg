# ============================================================================
# HAProxy 代理层配置（与平台同一镜像，容器内反向代理）
#
# 拓扑（容器内）：client -> HAProxy(:8080 入口 / :8404 stats) -> uvicorn(127.0.0.1:18000)
# 说明：入口用高位端口 8080，避免非 root（uid 1000）绑定特权端口对运行时内核参数的依赖；
#       宿主端口由 docker compose 映射（默认 18080 -> 8080）。
#   - /portal     管理 Portal（FastAPI 静态挂载）
#   - /api/v1     北向业务 API
#   - /admin     管理面（独立 admin 鉴权）
#   - /docs /api-browser /api/catalog /api/error-codes /health 等系统路由
#
# 本文件为镜像内模板 /etc/haproxy/haproxy.cfg.tmpl，容器启动时由
# docker/entrypoint.sh 用 envsubst 渲染 ${HAPROXY_STATS_USER} /
# ${HAPROXY_STATS_PASSWORD} 后由 haproxy 加载（修改需重新构建镜像）。
#
# 安全说明：
#   - 平台 uvicorn 仅监听 127.0.0.1:18000，对外不直接暴露，唯一入口为 HAProxy；
#   - 身份头剥离默认启用（防止客户端伪造 X-User-Id 等）；gateway_header 模式需
#     前置可信网关注入 X-Auth-* 头，并设置 HAPROXY_INJECT_IDENTITY=1 启用下方映射
#     （前端网关必须剥离客户端伪造的 X-Auth-* 与 X-User-* 头后再转发）。
# ============================================================================

global
  log stdout format raw local0 notice
  maxconn 4096

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option http-server-close
  option forwardfor if-none
  timeout connect 5s
  timeout client 30s
  timeout server 60s
  timeout http-keep-alive 10s

# ---------- 前端入口 ----------
frontend web
  bind *:8080
  default_backend open_ikc_backend

  # 安全响应头（平台为 HTTP/JSON + 静态 Portal，统一加固）
  http-response set-header X-Content-Type-Options nosniff
  http-response set-header X-Frame-Options SAMEORIGIN
  http-response set-header Referrer-Policy strict-origin-when-cross-origin

  # 若前面还有 TLS 终止网关，可取消注释以透传协议：
  # http-request set-header X-Forwarded-Proto https if { ssl_fc }

# ---------- 平台后端 ----------
backend open_ikc_backend
  # app 为 docker compose 服务名（FastAPI，容器内 18000）
  # 健康探测与 compose healthcheck 统一走 /health
  option httpchk GET /health
  server app 127.0.0.1:18000 check inter 3s fall 3 rise 2 maxconn 1024

  # 默认剥离客户端伪造的身份头（static / gateway_header 模式下身份均取自请求头，
  # 禁止客户端自报 X-User-Id / X-Tenant-Id / 角色 / 权限，避免数据越权）。
  http-request del-header X-User-Id
  http-request del-header X-Tenant-Id
  http-request del-header X-User-Roles
  http-request del-header X-User-Scopes
  http-request del-header X-User-Permissions
  http-request del-header X-User-Deny-Permissions

  # gateway_header 模式：设置 HAPROXY_INJECT_IDENTITY=1 后，将前置可信网关传入的
  # X-Auth-* 头映射为平台默认身份头名（默认头名可用 OPEN_PLATFORM_AUTH_HEADER_* 调整）。
  http-request set-header X-User-Id       %[req.hdr(X-Auth-User-Id)] if { env(HAPROXY_INJECT_IDENTITY) -m str 1 }
  http-request set-header X-Tenant-Id     %[req.hdr(X-Auth-Tenant-Id)] if { env(HAPROXY_INJECT_IDENTITY) -m str 1 }
  http-request set-header X-User-Roles    %[req.hdr(X-Auth-User-Roles)] if { env(HAPROXY_INJECT_IDENTITY) -m str 1 }
  http-request set-header X-User-Scopes   %[req.hdr(X-Auth-User-Scopes)] if { env(HAPROXY_INJECT_IDENTITY) -m str 1 }
  http-request set-header X-User-Permissions   %[req.hdr(X-Auth-User-Permissions)] if { env(HAPROXY_INJECT_IDENTITY) -m str 1 }
  http-request set-header X-User-Deny-Permissions %[req.hdr(X-Auth-User-Deny-Permissions)] if { env(HAPROXY_INJECT_IDENTITY) -m str 1 }

# ---------- HAProxy 监控（stats） ----------
listen stats
  bind *:8404
  mode http
  stats enable
  stats hide-version
  stats realm HAProxy\ Statistics
  stats uri /
  stats refresh 5s
  stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}
