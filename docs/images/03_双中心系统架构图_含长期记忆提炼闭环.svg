        font-family: "Source Han Sans SC", "Noto Sans CJK SC",
                     "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .title { font-size: 35px; font-weight: 800; fill: #203147; }
      .subtitle { font-size: 20px; fill: #65768A; }
      .section { font-size: 22px; font-weight: 700; fill: #263D57; }
      .heading { font-size: 19px; font-weight: 700; fill: #263D57; }
      .body { font-size: 18px; fill: #374A60; }
      .small { font-size: 16px; fill: #63778C; }
      .tiny { font-size: 15px; fill: #718197; }
      .blue { fill: #32649C; }
      .amber { fill: #A97124; }
      .green { fill: #237661; }
      .purple { fill: #75569F; }
      .bold { font-weight: 700; }

      .query {
        fill: none; stroke: #32649C; stroke-width: 2.4;
        marker-start: url(#blue-arrow);
        marker-end: url(#blue-arrow);
      }
      .decision {
        fill: none; stroke: #B78130; stroke-width: 2.4;
        marker-start: url(#amber-arrow);
        marker-end: url(#amber-arrow);
      }
      .build {
        fill: none; stroke: #7C8DA0; stroke-width: 2.2;
        stroke-dasharray: 7 5;
        marker-end: url(#gray-arrow);
      }
      .semantic-feedback {
        fill: none; stroke: #B78130; stroke-width: 2.2;
        stroke-dasharray: 7 5;
        marker-end: url(#amber-arrow);
      }
      .execution {
        fill: none; stroke: #27816D; stroke-width: 2.5;
        marker-start: url(#green-arrow);
        marker-end: url(#green-arrow);
      }
      .memory {
