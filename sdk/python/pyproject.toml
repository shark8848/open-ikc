[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ikc-sdk"
version = "1.0.0"
description = "OpenIKC 开放平台应用集成 SDK（知识库 / 文档 / 解析 / 检索）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["open_ikc_sdk*"]
