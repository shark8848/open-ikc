<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1920 1080">

  <title>本体中心销户推理原理：合约协议、挽留自助与派单</title>
  <desc>
    以模拟客户C001说明销户推理原理。
    评估日期为2026-10-19，合约限制截止日期为2026-09-30，
    合约状态为已结束，无续约，无靓号协议限制。
    客户非高价值客群，欠费为0，无待处理业务绑定，
    自助渠道支持该号码及地域，无相关在途工单，
    符合示例挽留活动条件。
    第一阶段判断合约与协议限制，第二阶段判断挽留资格、
    自助条件及派单策略。客户拒绝挽留并选择自助后，
    输出自助办理引导建议，而不是销户完成状态。
    所有客户、规则、活动和派单配置均为模拟示例。
    顶部140像素预留PPT标题。
  </desc>

  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "PingFang SC",
                     "Noto Sans CJK SC", Arial, sans-serif;
      }
      .section {
        font-size: 23px;
        font-weight: 700;
        fill: #193E68;
      }
      .title {
        font-size: 18px;
        font-weight: 700;
        fill: #193E68;
      }
      .body {
        font-size: 16px;
        fill: #445F7A;
      }
      .small {
        font-size: 14px;
        fill: #617A93;
      }
      .code {
        font-family: Consolas, "DejaVu Sans Mono", monospace;
        font-size: 14px;
        fill: #315F94;
      }
      .arrow {
        fill: none;
        stroke: #537EB3;
        stroke-width: 2.5;
        marker-end: url(#blue-arrow);
      }
      .purple-arrow {
        fill: none;
        stroke: #8764AE;
        stroke-width: 2.5;
        marker-end: url(#purple-arrow);
      }
      .teal-arrow {
        fill: none;
        stroke: #26938D;
        stroke-width: 2.5;
        marker-end: url(#teal-arrow);
      }
      .relation {
        fill: none;
        stroke: #8D75AF;
        stroke-width: 2;
        marker-end: url(#purple-arrow);
      }
    </style>

    <marker id="blue-arrow" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#537EB3"/>
    </marker>

    <marker id="purple-arrow" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8764AE"/>
    </marker>

    <marker id="teal-arrow" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#26938D"/>
    </marker>

    <!-- 数据库图标 -->
    <g id="database" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round">
      <ellipse cx="16" cy="7" rx="11" ry="4"/>
      <path d="M5 7 V25 C5 30 27 30 27 25 V7"/>
      <path d="M5 15 C5 20 27 20 27 15"/>
    </g>

    <!-- 本体图标 -->
    <g id="graph" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round">
      <circle cx="16" cy="6" r="4"/>
      <circle cx="6" cy="25" r="4"/>
      <circle cx="26" cy="25" r="4"/>
      <path d="M14 10 L8 21 M18 10 L24 21 M10 25 H22"/>
    </g>

    <!-- 结果图标 -->
    <g id="check" fill="none" stroke="currentColor"
       stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="12"/>
      <path d="M9 16 L14 21 L23 11"/>
    </g>

    <!-- 坐席图标 -->
    <g id="seat" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="11" r="5"/>
      <path d="M8 12 V10 A8 8 0 0 1 24 10 V15"/>
      <rect x="5" y="11" width="4" height="7" rx="2"/>
      <rect x="23" y="11" width="4" height="7" rx="2"/>
      <path d="M25 18 V21 H19"/>
      <path d="M5 29 C6 20 26 20 27 29"/>
    </g>
  </defs>

  <!-- 顶部0～140px预留PPT标题 -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <text x="60" y="153" font-size="18" fill="#526E8C">
    示例：客户提出销户，系统判断协议限制、挽留资格与可执行办理路径
  </text>

  <rect x="1435" y="132" width="425" height="29" rx="8" fill="#FFF3DF"/>
  <text x="1647" y="152" text-anchor="middle"
        font-size="15" font-weight="700" fill="#A47128">
    模拟客户 / 协议 / 规则数据，非现网政策
  </text>

  <!-- ==================================================
       顶部：服务调用链
       ================================================== -->
  <rect x="60" y="176" width="1800" height="83" rx="14"
        fill="#EFF4FB" stroke="#D6E2EF"/>

  <rect x="80" y="190" width="310" height="55" rx="10"
        fill="#FFFFFF" stroke="#8FAED1"/>
  <text x="235" y="213" text-anchor="middle" class="title">
    知识中心：融合检索和推理服务
  </text>
  <text x="235" y="234" text-anchor="middle" class="small">
    组织客户事实、协议条款与办理条件
  </text>

  <path d="M390 218 H655" class="arrow"/>
  <text x="521" y="205" text-anchor="middle" class="code">
    POST /inference/evaluate
  </text>
  <text x="521" y="240" text-anchor="middle" class="small">
    分阶段提交：CONTRACT / ROUTING
  </text>

  <rect x="655" y="190" width="520" height="55" rx="10"
        fill="#66508D"/>
  <text x="915" y="213" text-anchor="middle"
        font-size="21" font-weight="700" fill="#FFFFFF">
    本体中心推理服务
  </text>
  <text x="915" y="235" text-anchor="middle"
        font-size="15" fill="#E9E0F5">
    事实校验 → 关系解析 → 分阶段规则求值 → 路径决策
  </text>

  <path d="M1175 218 H1430" class="teal-arrow"/>
  <text x="1302" y="205" text-anchor="middle" class="small">
    限制、资格、办理路径、派单建议
  </text>
  <text x="1302" y="240" text-anchor="middle" class="small">
    决策ID + 命中规则 + 证据引用
  </text>

  <rect x="1430" y="190" width="410" height="55" rx="10"
        fill="#FFFFFF" stroke="#82B5A4"/>
  <text x="1635" y="213" text-anchor="middle" class="title">
    智能体 → 坐席确认 → 对应业务MCP
  </text>
  <text x="1635" y="234" text-anchor="middle" class="small">
    解释决策、获取客户选择、执行对应分支
  </text>

  <!-- ==================================================
       三栏背景
       ================================================== -->
  <rect x="60" y="279" width="495" height="518" rx="14"
        fill="#F5F9FD" stroke="#D6E2EF"/>
  <rect x="575" y="279" width="775" height="518" rx="14"
        fill="#F7F3FC" stroke="#DED3EB"/>
  <rect x="1370" y="279" width="490" height="518" rx="14"
        fill="#F3F9F6" stroke="#D4E7DD"/>

  <use xlink:href="#database" x="80" y="294" color="#315F94"/>
  <text x="125" y="318" class="section">① 输入：事实、条款与客户选择</text>

  <use xlink:href="#graph" x="595" y="294" color="#7653A6"/>
  <text x="640" y="318" class="section">② 原理：两阶段判断与路径选择</text>

  <use xlink:href="#check" x="1390" y="294" color="#26938D"/>
  <text x="1435" y="318" class="section">③ 输出：可解释、可执行的建议</text>

  <!-- ==================================================
       左栏：输入事实
       ================================================== -->
  <rect x="80" y="338" width="455" height="145" rx="10"
        fill="#FFFFFF" stroke="#C8D8E9"/>
  <text x="96" y="364" class="title">客户与合约事实｜客户 C001</text>

  <text x="96" y="389" class="body">
    号码引用：N001；当前套餐：P169
  </text>
  <text x="96" y="413" class="body">
    身份校验：通过；高价值客群：false
  </text>
  <text x="96" y="437" class="body">
    合约状态：已结束；续约：无
  </text>
  <text x="96" y="460" class="body">
    限制截止：2026-09-30；靓号协议：无
  </text>
  <text x="96" y="478" class="small">
    CRM MCP查询｜评估日：2026-10-19｜事实 F21
  </text>

  <rect x="80" y="495" width="455" height="128" rx="10"
        fill="#FFFFFF" stroke="#C8D8E9"/>
  <text x="96" y="521" class="title">渠道与业务条件｜对应系统MCP查询</text>
  <text x="96" y="546" class="body">
    欠费：0元；待处理业务绑定：无
  </text>
  <text x="96" y="570" class="body">
    自助渠道支持号码及地域：true
  </text>
  <text x="96" y="594" class="body">
    相关在途工单：[]；挽留活动适用：true
  </text>
  <text x="96" y="615" class="small">
    空列表与“无”均为明确查询结果，不是字段缺失
  </text>

  <rect x="80" y="635" width="455" height="65" rx="10"
        fill="#EAF1FA" stroke="#D7E3EF"/>
  <text x="96" y="660" class="title">知识与版本｜知识中心提供</text>
  <text x="96" y="684" class="small">
    协议条款 A01、权益 E01、自助指引 G01｜K15
  </text>

  <rect x="80" y="712" width="455" height="66" rx="10"
        fill="#EAF2FF" stroke="#A8C1DF"/>
  <use xlink:href="#seat" x="94" y="726" color="#3978BD"/>
  <text x="137" y="737" font-size="17" font-weight="700" fill="#315F94">
    坐席后续输入｜客户反馈 CF02
  </text>
  <text x="137" y="762" font-size="16" fill="#445F7A">
    “不接受挽留，继续销户，选择自助办理。”
  </text>

  <!-- ==================================================
       中栏：本体与规则处理
       ================================================== -->
  <rect x="595" y="338" width="735" height="117" rx="10"
        fill="#FFFFFF" stroke="#D8CCE9"/>
  <text x="611" y="364" class="title">本体模型：明确“谁、哪个号码、受什么约束、能走哪条路”</text>

  <rect x="613" y="391" width="100" height="37" rx="8"
        fill="#E9F1FF" stroke="#A6BFDE"/>
  <text x="663" y="415" text-anchor="middle"
        font-size="16" fill="#315F94">客户 C001</text>

  <rect x="794" y="391" width="100" height="37" rx="8"
        fill="#EDE5F7" stroke="#B7A1D0"/>
  <text x="844" y="415" text-anchor="middle"
        font-size="16" fill="#7653A6">号码 N001</text>

  <rect x="981" y="391" width="128" height="37" rx="8"
        fill="#EDE5F7" stroke="#B7A1D0"/>
  <text x="1045" y="415" text-anchor="middle"
        font-size="16" fill="#7653A6">合约 / 协议</text>

  <rect x="1185" y="391" width="126" height="37" rx="8"
        fill="#EAF5EE" stroke="#A2C8B3"/>
  <text x="1248" y="415" text-anchor="middle"
        font-size="16" fill="#28654F">限制与条件</text>

  <path d="M713 409 H794" class="relation"/>
  <text x="753" y="398" text-anchor="middle"
        font-size="13" fill="#7653A6">持有</text>

  <path d="M894 409 H981" class="relation"/>
  <text x="937" y="398" text-anchor="middle"
        font-size="13" fill="#7653A6">关联</text>

  <path d="M1109 409 H1185" class="relation"/>
  <text x="1147" y="398" text-anchor="middle"
        font-size="13" fill="#7653A6">约束</text>

  <text x="611" y="447" class="small">
    号码同时关联：套餐、客群、可用渠道、权益活动、最近工单
  </text>

  <!-- 第一阶段 -->
  <rect x="595" y="467" width="735" height="85" rx="10"
        fill="#FFFFFF" stroke="#BBA7D1" stroke-width="1.5"/>
  <circle cx="620" cy="491" r="13" fill="#8764AE"/>
  <text x="620" y="496" text-anchor="middle" font-size="15" fill="#FFFFFF">1</text>
  <text x="644" y="497" class="title">阶段一｜合约与协议判定 CONTRACT</text>
  <text x="611" y="521" class="body">
    已结束且无续约 ∧ 无靓号协议限制 → 本阶段允许继续评估
  </text>
  <text x="611" y="543" class="small">
    命中 C01、C02；输出 D-CON-001，不直接等同于最终可销户
  </text>

  <path d="M1268 455 V467" class="purple-arrow"/>

  <!-- 第二阶段 -->
  <rect x="595" y="565" width="735" height="100" rx="10"
        fill="#FFFFFF" stroke="#BBA7D1" stroke-width="1.5"/>
  <circle cx="620" cy="589" r="13" fill="#8764AE"/>
  <text x="620" y="594" text-anchor="middle" font-size="15" fill="#FFFFFF">2</text>
  <text x="644" y="595" class="title">阶段二｜挽留、自助与派单条件 ROUTING</text>
  <text x="611" y="620" class="body">
    挽留活动适用 → 可提供权益E01；不代表客户已接受
  </text>
  <text x="611" y="643" class="body">
    合约通过 + 已核验身份 + 无欠费 / 绑定 / 冲突 + 渠道支持 → 自助可选
  </text>
  <text x="611" y="660" class="small">
    输出资格及可选路径；检查高价值人工策略与相关在途工单
  </text>

  <path d="M1268 552 V565" class="purple-arrow"/>

  <!-- 客户反馈加入路由求值 -->
  <rect x="595" y="678" width="735" height="100" rx="10"
        fill="#EDE5F7" stroke="#D1C2E2"/>
  <circle cx="620" cy="702" r="13" fill="#8764AE"/>
  <text x="620" y="707" text-anchor="middle" font-size="15" fill="#FFFFFF">3</text>
  <text x="644" y="708" class="title">反馈后更新路由｜按客户选择，不强制挽留</text>
  <text x="611" y="733" class="body">
    拒绝挽留 ∧ 继续销户 ∧ 自助可选 ∧ 选择自助 → SELF_SERVICE
  </text>
  <text x="611" y="756" class="small">
    高价值 / 关键事实未知 → 人工；不满足自助但允许派单 → 工单路径
  </text>
  <text x="611" y="774" class="small">
    有相关在途工单 → 按规则关联 / 跟进，不重复建单；规则冲突 → 人工核验
  </text>

  <path d="M1268 665 V678" class="purple-arrow"/>
  <path d="M535 745 H595" class="arrow"/>
  <text x="565" y="733" text-anchor="middle"
        font-size="12" fill="#315F94">反馈</text>

  <!-- ==================================================
       右栏：结果
       ================================================== -->
  <rect x="1390" y="338" width="450" height="180" rx="12"
        fill="#FFFFFF" stroke="#8DBCA6" stroke-width="1.6"/>
  <path d="M1402 338 H1828 Q1840 338 1840 350 V378
           H1390 V350 Q1390 338 1402 338" fill="#E0F0E7"/>

  <text x="1408" y="365" font-size="20" font-weight="700" fill="#28654F">
    本例结果：进入自助销户引导
  </text>

  <text x="1408" y="404" class="code">contractGate: PASS</text>
  <text x="1408" y="429" class="code">retentionEligible: true</text>
  <text x="1408" y="454" class="code">selfServiceEligible: true</text>
  <text x="1408" y="479" class="code">selectedRoute: SELF_SERVICE</text>
  <text x="1408" y="505" class="small">
    原因：客户拒绝挽留，且符合并选择自助办理
  </text>

  <rect x="1390" y="530" width="450" height="105" rx="12"
        fill="#FFFFFF" stroke="#B8D3C4"/>
  <text x="1408" y="557" class="title">智能体执行：销户MCP</text>
  <text x="1408" y="582" class="code">cancel.create_self_service</text>
  <text x="1408" y="606" class="body">
    入：号码引用、决策ID、客户选择凭证
  </text>
  <text x="1408" y="626" class="small">
    出：自助入口、流程ID、指引；不返回“销户完成”
  </text>

  <rect x="1390" y="647" width="450" height="68" rx="12"
        fill="#FFF7E9" stroke="#EBD1AA"/>
  <text x="1408" y="672" font-size="17" font-weight="700" fill="#A47128">
    条件变化时的分支（非本例同时执行）
  </text>
  <text x="1408" y="696" font-size="15" fill="#936F3C">
    自助不满足且可派单 → 工单MCP；高价值 / 异常 → 人工
  </text>

  <rect x="1390" y="727" width="450" height="51" rx="10"
        fill="#EAF3EE" stroke="#C9DFD2"/>
  <text x="1408" y="748" class="code">
    decisionId: D-ROUTE-002
  </text>
  <text x="1408" y="769" class="small">
    关联 D-CON-001｜F21 + CF02 + K15 + O4 + R9
  </text>

  <!-- ==================================================
       底部：执行记录
       ================================================== -->
  <rect x="60" y="815" width="1800" height="197" rx="14"
        fill="#FFFFFF" stroke="#D4E0ED" stroke-width="1.4"/>

  <path d="M74 815 H1846 Q1860 815 1860 829 V853
           H60 V829 Q60 815 74 815" fill="#EAF0F8"/>

  <text x="80" y="841" font-size="20" font-weight="700" fill="#24558F">
    规则执行记录｜事实快照 + 客户反馈 + 本体 / 规则版本 + 评估时间，构成可复现的判断依据
  </text>

  <rect x="75" y="863" width="1770" height="26" fill="#F3F6FB"/>
  <text x="90" y="882" font-size="15" font-weight="700" fill="#365675">规则ID</text>
  <text x="345" y="882" font-size="15" font-weight="700" fill="#365675">本例输入与求值</text>
  <text x="1165" y="882" font-size="15" font-weight="700" fill="#365675">输出及证据</text>

  <!-- 记录1 -->
  <text x="90" y="911" font-size="15" fill="#445F7A">C01 / C02 合约与协议</text>
  <text x="345" y="911" font-size="15" fill="#445F7A">
    2026-10-19晚于限制截止日；合约已结束、无续约；无靓号协议
  </text>
  <text x="1165" y="911" font-size="15" fill="#137D79">
    PASS｜CRM事实F21 + 条款A01 → D-CON-001
  </text>

  <line x1="85" y1="920" x2="1835" y2="920" stroke="#E7EDF4"/>

  <!-- 记录2 -->
  <text x="90" y="940" font-size="15" fill="#445F7A">C03 挽留 / C04 自助</text>
  <text x="345" y="940" font-size="15" fill="#445F7A">
    活动适用=true；身份已核验、欠费0、无待处理绑定、自助渠道支持
  </text>
  <text x="1165" y="940" font-size="15" fill="#137D79">
    挽留资格=true；自助资格=true｜权益E01 / 指引G01
  </text>

  <line x1="85" y1="949" x2="1835" y2="949" stroke="#E7EDF4"/>

  <!-- 记录3 -->
  <text x="90" y="969" font-size="15" fill="#445F7A">C05 人工 / C06 工单</text>
  <text x="345" y="969" font-size="15" fill="#445F7A">
    高价值=false；关键事实完整；相关在途工单=[]；无规则冲突
  </text>
  <text x="1165" y="969" font-size="15" fill="#137D79">
    本例不触发人工兜底，无在途工单冲突
  </text>

  <line x1="85" y1="978" x2="1835" y2="978" stroke="#E7EDF4"/>

  <!-- 记录4 -->
  <text x="90" y="998" font-size="15" fill="#445F7A">C07 客户选择与路由</text>
  <text x="345" y="998" font-size="15" fill="#445F7A">
    反馈CF02：拒绝挽留、继续销户、选择自助；与可选路径匹配
  </text>
  <text x="1165" y="998" font-size="15" fill="#137D79">
    SELF_SERVICE｜输出D-ROUTE-002，不创建销户工单
  </text>

  <!-- 最终业务落点 -->
  <rect x="60" y="1027" width="1800" height="34" rx="9"
        fill="#FFF3DF"/>

  <text x="960" y="1050" text-anchor="middle"
        font-size="16" fill="#936B2D">
    决策不等于办理完成：坐席告知 → 客户进入自助流程 → 业务系统实时复核与确认 → 执行销户 → 权威回执 → CRM回写与通知
  </text>
</svg>