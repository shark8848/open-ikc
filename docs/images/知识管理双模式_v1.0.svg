<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 72 1440 716"
     font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <!-- 公共渐变 -->
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <!-- 人工模式：蓝灰 -->
    <linearGradient id="gManual" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gManualLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <!-- Agent 模式：青绿 -->
    <linearGradient id="gAgent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="gAgentLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/><stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <!-- 摄入：蓝 -->
    <linearGradient id="gIngest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- 修订：琥珀 -->
    <linearGradient id="gRevise" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <!-- 测试：紫 -->
    <linearGradient id="gTest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <!-- 质量：玫红 -->
    <linearGradient id="gQuality" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <!-- 平台底座：天蓝 -->
    <linearGradient id="gPlatform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <!-- 箭头 marker -->
    <marker id="aMan" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
    </marker>
    <marker id="aAg" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#14b8a6"/>
    </marker>
    <marker id="aInd" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#0369a1"/>
    </marker>
    <marker id="aIn" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="aRv" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="aTs" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8b5cf6"/>
    </marker>
    <marker id="aQy" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1440" height="840" fill="url(#gBg)" rx="6"/>

  <!-- ══ 左侧：人工驱动流水线模式 ══ -->
  <rect x="30" y="78" width="420" height="520" rx="10" fill="url(#gManualLight)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- 左区标题 -->
  <rect x="30" y="78" width="420" height="38" rx="10" fill="url(#gManual)"/>
  <rect x="30" y="102" width="420" height="14" fill="url(#gManual)"/>
  <text x="240" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="white">模式一：人工驱动流水线</text>

  <!-- 角色框 -->
  <rect x="50" y="124" width="160" height="32" rx="6" fill="white" stroke="#94a3b8" stroke-width="1"/>
  <text x="130" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">👤 开发者 / 运维</text>
  <rect x="230" y="124" width="200" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="330" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">对接方式</text>
  <text x="330" y="155" text-anchor="middle" font-size="10" fill="#64748b">SDK · REST API · MCP CLI</text>

  <!-- 流水线步骤 -->
  <text x="50" y="180" font-size="11" font-weight="bold" fill="#334155">典型工作流（逐接口手动驱动）</text>

  <!-- Step 1 -->
  <rect x="50" y="190" width="380" height="34" rx="5" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="50" y="190" width="28" height="34" rx="5" fill="#94a3b8"/>
  <text x="64" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="white">1</text>
  <text x="88" y="204" font-size="11" font-weight="bold" fill="#334155">建库与配置</text>
  <text x="88" y="219" font-size="10" fill="#64748b">kb_create → 手填 kbType / metadataSchema / wikiConfig</text>

  <line x1="240" y1="224" x2="240" y2="238" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aMan)"/>

  <!-- Step 2 -->
  <rect x="50" y="240" width="380" height="34" rx="5" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="50" y="240" width="28" height="34" rx="5" fill="#94a3b8"/>
  <text x="64" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="white">2</text>
  <text x="88" y="254" font-size="11" font-weight="bold" fill="#334155">上传与解析</text>
  <text x="88" y="269" font-size="10" fill="#64748b">手动上传文件 / 填 URL → 选解析策略 → parse_start</text>

  <line x1="240" y1="274" x2="240" y2="288" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aMan)"/>

  <!-- Step 3 -->
  <rect x="50" y="290" width="380" height="34" rx="5" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="50" y="290" width="28" height="34" rx="5" fill="#94a3b8"/>
  <text x="64" y="311" text-anchor="middle" font-size="11" font-weight="bold" fill="white">3</text>
  <text x="88" y="304" font-size="11" font-weight="bold" fill="#334155">检索验证</text>
  <text x="88" y="319" font-size="10" fill="#64748b">人工写 query → universal-search → 检查命中质量</text>

  <line x1="240" y1="324" x2="240" y2="338" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aMan)"/>

  <!-- Step 4 -->
  <rect x="50" y="340" width="380" height="34" rx="5" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="50" y="340" width="28" height="34" rx="5" fill="#94a3b8"/>
  <text x="64" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="white">4</text>
  <text x="88" y="354" font-size="11" font-weight="bold" fill="#334155">质量问题发现</text>
  <text x="88" y="369" font-size="10" fill="#64748b">人工巡检 · 听用户反馈 · 发现过期/冲突/缺失（滞后）</text>

  <line x1="240" y1="374" x2="240" y2="388" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aMan)"/>

  <!-- Step 5 -->
  <rect x="50" y="390" width="380" height="34" rx="5" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="50" y="390" width="28" height="34" rx="5" fill="#94a3b8"/>
  <text x="64" y="411" text-anchor="middle" font-size="11" font-weight="bold" fill="white">5</text>
  <text x="88" y="404" font-size="11" font-weight="bold" fill="#334155">手动修订</text>
  <text x="88" y="419" font-size="10" fill="#64748b">人工修改 wiki/graph API · 重新触发 parse · 逐项确认</text>

  <!-- 痛点说明 -->
  <rect x="50" y="440" width="380" height="75" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
  <text x="240" y="460" text-anchor="middle" font-size="11" font-weight="bold" fill="#be123c">⚠ 流水线模式局限</text>
  <text x="60" y="478" font-size="10" fill="#9f1239">• 每步需人工判断参数，技术门槛高，业务人员难以上手</text>
  <text x="60" y="493" font-size="10" fill="#9f1239">• 质量问题靠人工巡检，发现滞后，修复周期长</text>
  <text x="60" y="508" font-size="10" fill="#9f1239">• 修订链路人工驱动，无法支撑规模化知识运营</text>

  <!-- ══ 右侧：Deep Agent 助手辅助模式 ══ -->
  <rect x="480" y="78" width="930" height="520" rx="10" fill="url(#gAgentLight)" stroke="#5eead4" stroke-width="2"/>

  <!-- 右区标题 -->
  <rect x="480" y="78" width="930" height="38" rx="10" fill="url(#gAgent)"/>
  <rect x="480" y="102" width="930" height="14" fill="url(#gAgent)"/>
  <text x="945" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="white">模式二：Deep Agent 助手辅助 · 智能知识治理</text>

  <!-- 角色 + 交互入口 -->
  <rect x="500" y="124" width="200" height="34" rx="6" fill="white" stroke="#5eead4" stroke-width="1.5"/>
  <text x="600" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">🙋 知识管理员 / 业务用户</text>

  <!-- 对话入口 -->
  <rect x="720" y="124" width="180" height="34" rx="6" fill="url(#gAgent)" opacity="0.15" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="810" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">💬 自然语言对话</text>

  <!-- Agent 编排说明 -->
  <rect x="920" y="124" width="470" height="34" rx="6" fill="white" stroke="#99f6e4" stroke-width="1"/>
  <text x="1155" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">🧠 Deep Agent 编排</text>
  <text x="1155" y="155" text-anchor="middle" font-size="10" fill="#0d9488">意图理解 → 任务规划 → 工具选择 → 执行 → 反思 → 人工确认闸门（写操作）</text>

  <!-- 四种能力大区块 -->
  <text x="500" y="182" font-size="11" font-weight="bold" fill="#0f766e">助手辅助知识管理四大能力</text>

  <!-- 能力1：知识摄入 -->
  <rect x="500" y="190" width="210" height="155" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="500" y="190" width="210" height="30" rx="8" fill="url(#gIngest)"/>
  <rect x="500" y="210" width="210" height="10" fill="url(#gIngest)"/>
  <text x="605" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📥 智能知识摄入</text>
  <text x="510" y="236" font-size="10" font-weight="bold" fill="#1d4ed8">Agent 自动完成：</text>
  <text x="510" y="252" font-size="10" fill="#334155">• 理解上传内容语义</text>
  <text x="510" y="267" font-size="10" fill="#334155">• 推荐目标知识库</text>
  <text x="510" y="282" font-size="10" fill="#334155">• 生成标签与元数据</text>
  <text x="510" y="297" font-size="10" fill="#334155">• document_upload</text>
  <text x="510" y="312" font-size="10" fill="#334155">• document_register</text>
  <text x="510" y="327" font-size="10" fill="#334155">• wiki_build（自动建页）</text>
  <text x="510" y="342" font-size="9" fill="#3b82f6">→ 人工审批闸门后入库</text>

  <!-- 能力2：知识修订 -->
  <rect x="728" y="190" width="210" height="155" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="728" y="190" width="210" height="30" rx="8" fill="url(#gRevise)"/>
  <rect x="728" y="210" width="210" height="10" fill="url(#gRevise)"/>
  <text x="833" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="white">✏️ 知识修订</text>
  <text x="738" y="236" font-size="10" font-weight="bold" fill="#b45309">Agent 主动发现并修复：</text>
  <text x="738" y="252" font-size="10" fill="#334155">• Wiki 页面过期内容标注</text>
  <text x="738" y="267" font-size="10" fill="#334155">• wiki_write 修订提案</text>
  <text x="738" y="282" font-size="10" fill="#334155">• graph_entity_patch</text>
  <text x="738" y="297" font-size="10" fill="#334155">• graph_corrections_apply</text>
  <text x="738" y="312" font-size="10" fill="#334155">• graph_revision_revert</text>
  <text x="738" y="327" font-size="10" fill="#334155">• 多文档冲突检测合并</text>
  <text x="738" y="342" font-size="9" fill="#d97706">→ 人工确认闸门后写操作生效</text>

  <!-- 能力3：知识测试 -->
  <rect x="956" y="190" width="210" height="155" rx="8" fill="white" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="956" y="190" width="210" height="30" rx="8" fill="url(#gTest)"/>
  <rect x="956" y="210" width="210" height="10" fill="url(#gTest)"/>
  <text x="1061" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🔍 知识测试</text>
  <text x="966" y="236" font-size="10" font-weight="bold" fill="#5b21b6">Agent 以提问验证知识：</text>
  <text x="966" y="252" font-size="10" fill="#334155">• universal_search 覆盖测试</text>
  <text x="966" y="267" font-size="10" fill="#334155">• graph_search 关系验证</text>
  <text x="966" y="282" font-size="10" fill="#334155">• graph_neighbors 多跳检测</text>
  <text x="966" y="297" font-size="10" fill="#334155">• wiki_page 内容核查</text>
  <text x="966" y="312" font-size="10" fill="#334155">• 检索零命中 → 知识空白发现</text>
  <text x="966" y="327" font-size="10" fill="#334155">• 生成测试用例并记录差距</text>
  <text x="966" y="342" font-size="9" fill="#7c3aed">→ 输出知识覆盖率报告</text>

  <!-- 能力4：质量分析 -->
  <rect x="1184" y="190" width="210" height="155" rx="8" fill="white" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="1184" y="190" width="210" height="30" rx="8" fill="url(#gQuality)"/>
  <rect x="1184" y="210" width="210" height="10" fill="url(#gQuality)"/>
  <text x="1289" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📊 质量分析</text>
  <text x="1194" y="236" font-size="10" font-weight="bold" fill="#be123c">Agent 综合分析库质量：</text>
  <text x="1194" y="252" font-size="10" fill="#334155">• graph_stat schema_coverage</text>
  <text x="1194" y="267" font-size="10" fill="#334155">• wiki_stat 页面完整度</text>
  <text x="1194" y="282" font-size="10" fill="#334155">• index_status 索引健康度</text>
  <text x="1194" y="297" font-size="10" fill="#334155">• 知识新鲜度与有效期检测</text>
  <text x="1194" y="312" font-size="10" fill="#334155">• 冲突/重复实体识别</text>
  <text x="1194" y="327" font-size="10" fill="#334155">• 生成改善建议优先级</text>
  <text x="1194" y="342" font-size="9" fill="#e11d48">→ 输出知识质量评分报告</text>

  <!-- Agent 对话示例框 -->
  <rect x="500" y="360" width="420" height="222" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="710" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">对话示例：助手辅助知识修订</text>

  <!-- 对话气泡 -->
  <rect x="514" y="392" width="240" height="28" rx="10" fill="#ccfbf1"/>
  <text x="522" y="410" font-size="10" fill="#134e4a">🙋 "客服知识库有答案说退货政策是7天，"</text>
  <rect x="514" y="424" width="200" height="28" rx="10" fill="#ccfbf1"/>
  <text x="522" y="442" font-size="10" fill="#134e4a">   但最新规定是15天了，能帮我修正吗？"</text>

  <rect x="560" y="460" width="344" height="48" rx="10" fill="white" stroke="#5eead4" stroke-width="1"/>
  <text x="568" y="478" font-size="10" fill="#0f766e">🤖 Agent：检索确认 → wiki_page 找到过时页面</text>
  <text x="568" y="494" font-size="10" fill="#0f766e">      → 生成修订提案（diff）→ 等待人工审批</text>

  <rect x="514" y="516" width="320" height="28" rx="10" fill="#ccfbf1"/>
  <text x="522" y="534" font-size="10" fill="#134e4a">🙋 "确认修订，并检查还有哪些相关页面需要更新"</text>

  <rect x="560" y="552" width="344" height="28" rx="10" fill="white" stroke="#5eead4" stroke-width="1"/>
  <text x="568" y="570" font-size="10" fill="#0f766e">🤖 wiki_write 执行修订 · graph_search 找出关联节点</text>

  <!-- Agent 操作链路说明（右侧） -->
  <rect x="950" y="360" width="444" height="222" rx="8" fill="white" stroke="#99f6e4" stroke-width="1"/>
  <text x="1172" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">助手辅助操作链路（相对流水线的核心差异）</text>

  <text x="962" y="402" font-size="10" font-weight="bold" fill="#0d9488">智能决策代替人工判断</text>
  <text x="962" y="418" font-size="10" fill="#334155">流水线：人工选 API 参数 → Agent：自然语言意图 → 自动映射</text>

  <line x1="962" y1="428" x2="1380" y2="428" stroke="#e2e8f0" stroke-width="1"/>
  <text x="962" y="444" font-size="10" font-weight="bold" fill="#0d9488">主动发现代替人工巡检</text>
  <text x="962" y="460" font-size="10" fill="#334155">流水线：靠用户反馈 → Agent：定期测试 → 知识空白/冲突预警</text>

  <line x1="962" y1="470" x2="1380" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <text x="962" y="486" font-size="10" font-weight="bold" fill="#0d9488">安全审批闸门保障操作可控</text>
  <text x="962" y="502" font-size="10" fill="#334155">写操作（document_register / wiki_write / graph_*）触发 interrupt_on</text>
  <text x="962" y="518" font-size="10" fill="#334155">人工确认后才真正执行，权限模型与流水线完全一致</text>

  <line x1="962" y1="528" x2="1380" y2="528" stroke="#e2e8f0" stroke-width="1"/>
  <text x="962" y="544" font-size="10" font-weight="bold" fill="#0d9488">多工具联动闭环</text>
  <text x="962" y="560" font-size="10" fill="#334155">单次对话可串联：search验证 → wiki读取 → 生成修订提案</text>
  <text x="962" y="576" font-size="10" fill="#334155">→ 人工审批 → 执行修订 → 再次检索确认生效（完整闭环）</text>

  <!-- ══ 中间对比箭头标注 ══ -->
  <rect x="448" y="290" width="36" height="36" rx="18" fill="url(#gPlatform)" opacity="0.9"/>
  <text x="466" y="313" text-anchor="middle" font-size="16" fill="white">VS</text>

  <!-- ══ 底部：共享平台底座 ══ -->
  <rect x="30" y="610" width="1380" height="210" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
  <!-- 底座标题 -->
  <rect x="30" y="610" width="1380" height="34" rx="10" fill="url(#gPlatform)"/>
  <rect x="30" y="630" width="1380" height="14" fill="url(#gPlatform)"/>
  <text x="720" y="632" text-anchor="middle" font-size="13" font-weight="bold" fill="white">共享平台底座 —— 开放平台四类能力 API（两种模式最终调用同一套接口，权限模型完全一致）</text>

  <!-- 底座组件：四个能力域 -->
  <!-- 知识库 -->
