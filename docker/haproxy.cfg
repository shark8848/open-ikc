# ============================================================================
# HAProxy 代理层配置 —— 位于前端（管理 Portal / 北向 API）最外层统一入口
#
# 拓扑：client -> HAProxy(:80) -> app(:18000 FastAPI 北向平台)
#   - /portal     管理 Portal（FastAPI 静态挂载）
#   - /api/v1     北向业务 API
#   - /admin     管理面（独立 admin 鉴权）
#   - /docs /api-browser /api/catalog /api/error-codes /health 等系统路由
#
# 使用：docker compose 挂载本文件到 haproxy 容器（见 docker-compose.yml）；
#       ${HAPROXY_STATS_USER} / ${HAPROXY_STATS_PASSWORD} 由 compose 注入。
# 生产提示：
#   - 对外统一走 HAProxy（默认宿主端口 18080），不要直连 app:18000；
#   - 身份头剥离默认启用（防止客户端伪造 X-User-Id 等）；gateway_header 模式下
#     由前置可信网关注入身份，HAProxy 映射示例见 backend 段注释（按需启用）。
# ============================================================================

global
  log stdout format raw local0 notice
  maxconn 4096

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option http-server-close
  option forwardfor
  timeout connect 5s
  timeout client 30s
  timeout server 60s
  timeout http-keep-alive 10s

# ---------- 前端入口 ----------
frontend web
  bind *:80
  default_backend open_ikc_backend

  # 安全响应头（平台为 HTTP/JSON + 静态 Portal，统一加固）
  http-response set-header X-Content-Type-Options nosniff
  http-response set-header X-Frame-Options SAMEORIGIN
  http-response set-header Referrer-Policy strict-origin-when-cross-origin

  # 若前面还有 TLS 终止网关，可取消注释以透传协议：
  # http-request set-header X-Forwarded-Proto https if { ssl_fc }

# ---------- 平台后端 ----------
backend open_ikc_backend
  # app 为 docker compose 服务名（FastAPI，容器内 18000）
  # 健康探测与 compose healthcheck 统一走 /health
  option httpchk GET /health
  server app app:18000 check inter 3s fall 3 rise 2 maxconn 1024

  # 默认剥离客户端伪造的身份头（static / gateway_header 模式下身份均取自请求头，
  # 禁止客户端自报 X-User-Id / X-Tenant-Id / 角色 / 权限，避免数据越权）。
  http-request del-header X-User-Id
  http-request del-header X-Tenant-Id
  http-request del-header X-User-Roles
  http-request del-header X-User-Scopes
  http-request del-header X-User-Permissions
  http-request del-header X-User-Deny-Permissions

  # 生产 gateway_header 模式：身份由前置可信网关（SSO 等）以下列头传入，
  # HAProxy 映射为平台默认头名后转发（默认头名可用 OPEN_PLATFORM_AUTH_HEADER_* 调整）：
  # http-request set-header X-User-Id       %[req.hdr(X-Auth-User-Id)]
  # http-request set-header X-Tenant-Id     %[req.hdr(X-Auth-Tenant-Id)]
  # http-request set-header X-User-Roles    %[req.hdr(X-Auth-User-Roles)]
  # http-request set-header X-User-Scopes   %[req.hdr(X-Auth-User-Scopes)]
  # http-request set-header X-User-Permissions   %[req.hdr(X-Auth-User-Permissions)]
  # http-request set-header X-User-Deny-Permissions %[req.hdr(X-Auth-User-Deny-Permissions)]

# ---------- HAProxy 监控（stats） ----------
listen stats
  bind *:8404
  mode http
  stats enable
  stats hide-version
  stats realm HAProxy\ Statistics
  stats uri /
  stats refresh 5s
  stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}
